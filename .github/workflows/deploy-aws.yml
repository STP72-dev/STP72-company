name: Validate, Build, and Deploy to AWS ECS Express

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "HANDOFF.md"
      - "README.md"
      - "docs/**"
      - ".kb/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'stp72-company' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'default' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'stp72-company' }}
  ECS_TASK_EXECUTION_ROLE_ARN: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
  ECS_INFRASTRUCTURE_ROLE_ARN: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Quality Gate & Verification
  # ---------------------------------------------------------------------------
  validate:
    name: Code Quality & Definition of Done
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type checking
        run: bun x tsc --noEmit

      - name: Linting
        run: bun run lint

      - name: Format check
        run: bun x prettier --check .

      - name: Validate agent documentation
        run: python3 .agents/skills/maintaining-agent-docs/scripts/validate.py . --strict

      - name: Production build
        run: bun run build

  # ---------------------------------------------------------------------------
  # Stage 2: Protected Container Build, ECR Push, and ECS Deployment
  # ---------------------------------------------------------------------------
  release:
    name: Build Docker, Push to ECR, and Deploy ECS Express
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify AWS release configuration
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          ECS_SERVICE: ${{ env.ECS_SERVICE }}
          ECS_TASK_EXECUTION_ROLE_ARN: ${{ env.ECS_TASK_EXECUTION_ROLE_ARN }}
          ECS_INFRASTRUCTURE_ROLE_ARN: ${{ env.ECS_INFRASTRUCTURE_ROLE_ARN }}
          AWS_ROLE_TO_ASSUME: ${{ env.AWS_ROLE_TO_ASSUME }}
        run: |
          required=(AWS_ACCOUNT_ID ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE ECS_TASK_EXECUTION_ROLE_ARN ECS_INFRASTRUCTURE_ROLE_ARN AWS_ROLE_TO_ASSUME)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Actions repository variable $name is required."
              exit 1
            fi
          done

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy the immutable release to ECS Express Mode
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          execution-role-arn: ${{ env.ECS_TASK_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ env.ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 3000
          health-check-path: /hu
          cpu: "1024"
          memory: "2048"
          min-task-count: 1
          max-task-count: 2
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70
          log-group: /ecs/stp72-company
          log-stream-prefix: application
          tags: |
            Environment=production
            Application=stp72-company
            ManagedBy=github-actions

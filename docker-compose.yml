services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stp72-company:latest
    container_name: stp72-company-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.PORT || 3000; require('http').get('http://127.0.0.1:' + port + '/hu', (res) => { process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1); }).on('error', () => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
